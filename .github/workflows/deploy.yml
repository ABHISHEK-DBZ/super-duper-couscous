name: Deploy Exit Capsule Generator to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: exit-capsule-rg
  AZURE_APP_SERVICE_NAME: exit-capsule-generator
  AZURE_APP_SERVICE_PLAN_NAME: exit-capsule-plan
  AZURE_LOCATION: eastus
  PYTHON_VERSION: '3.12'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          pip install pytest pytest-asyncio
          python -m pytest -v || echo "Tests skipped - dependencies may not be installed"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Verify frontend build output
        run: |
          ls -la frontend/dist/
          ls -la frontend/dist/assets/ 2>/dev/null || echo "No assets directory found"

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create or update App Service
        run: |
          az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.AZURE_LOCATION }} || true
          az appservice plan create \
            --name ${{ env.AZURE_APP_SERVICE_PLAN_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --sku B1 \
            --is-linux || true
          az webapp create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --plan ${{ env.AZURE_APP_SERVICE_PLAN_NAME }} \
            --name ${{ env.AZURE_APP_SERVICE_NAME }} \
            --runtime "PYTHON|3.12" || true

      - name: Configure App Service settings
        run: |
          az webapp config appsettings set \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_APP_SERVICE_NAME }} \
            --settings \
              PORT="8000" \
              SESSION_COOKIE_SECURE="true" \
              REQUIRE_AUTH="false" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false" || true

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_APP_SERVICE_NAME }}
          package: .
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Verify deployment
        run: |
          curl -f https://${{ env.AZURE_APP_SERVICE_NAME }}.azurewebsites.net/api/health || echo "Health check failed - app may still be starting"